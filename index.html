:root{
  --bg:#F3F4F8;--surface:#FFFFFF;--surface2:#E7EAF2;--ink:#141C33;--muted:#5B6480;--line:#D5DAE6;
  --brand:#1B2547;--brand-ink:#FFFFFF;--soft:#E3E7F2;--sun:#C8203F;--sun-ink:#FFFFFF;
  --bad:#C0342C;--bad-bg:#FBE7E5;--warn:#A86200;--warn-bg:#FCEFD9;--good:#24804F;--good-bg:#E2F3E8;
  --awn1:#1B2547;--awn2:#141C38;
  --f-body:"Sarchia Makka","Vazirmatn","Noto Sans Arabic",Tahoma,Arial,sans-serif;
  --f-head:"Sarchia Makka","Vazirmatn","Noto Sans Arabic",Tahoma,Arial,sans-serif;
  color-scheme:light;--head-bg:#FFFFFF;--head-ink:#141C33;--head-muted:#5B6480;--head-line:#E3E6EE;--page:var(--bg-l,#F3F4F8);--page-ink:var(--pink-l,var(--ink));--page-muted:var(--pmut-l,var(--muted));
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1528;--surface:#18203A;--surface2:#212A47;--ink:#E6EAF4;--muted:#9AA3BE;--line:#2C3656;
    --brand:#E3E8F5;--brand-ink:#141C33;--soft:#232F52;--sun:#E0365A;--sun-ink:#FFFFFF;
    --bad:#F2756B;--bad-bg:#3A1A1E;--warn:#F2AE4A;--warn-bg:#382A14;--good:#62C98F;--good-bg:#15301F;
    --awn1:#1B2547;--awn2:#141C38;color-scheme:dark;--head-bg:#18203A;--head-ink:#E6EAF4;--head-muted:#9AA3BE;--head-line:#2C3656;--page:var(--bg-d,#0F1528);--page-ink:var(--pink-d,var(--ink));--page-muted:var(--pmut-d,var(--muted));
  }
}
:root[data-theme="dark"]{
  --bg:#0F1528;--surface:#18203A;--surface2:#212A47;--ink:#E6EAF4;--muted:#9AA3BE;--line:#2C3656;
    --brand:#E3E8F5;--brand-ink:#141C33;--soft:#232F52;--sun:#E0365A;--sun-ink:#FFFFFF;
    --bad:#F2756B;--bad-bg:#3A1A1E;--warn:#F2AE4A;--warn-bg:#382A14;--good:#62C98F;--good-bg:#15301F;
    --awn1:#1B2547;--awn2:#141C38;color-scheme:dark;--head-bg:#18203A;--head-ink:#E6EAF4;--head-muted:#9AA3BE;--head-line:#2C3656;--page:var(--bg-d,#0F1528);--page-ink:var(--pink-d,var(--ink));--page-muted:var(--pmut-d,var(--muted));
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{font-feature-settings:"tnum";margin:0;background:var(--page);background-attachment:fixed;min-height:100vh;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;padding-bottom:88px}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.muted{color:var(--muted)}

/* Awning header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;
  padding:12px 16px 10px;color:var(--head-ink);background:var(--head-bg);border-bottom:1px solid var(--head-line);box-shadow:0 2px 10px rgba(0,0,0,.08);transition:background-color .25s,color .25s}
.mark{flex:none;width:46px;height:46px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--head-bg),0 0 0 4px #C8203F}
.ttl{min-width:0}
.ttl h1{margin:0;font-family:var(--f-head);font-weight:800;font-size:17px;line-height:1.35}
.ttl small{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--head-muted)}
.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#22A06B;margin-inline-end:5px;vertical-align:middle}
.local::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sun);margin-inline-end:5px;vertical-align:middle}
.clock{margin-inline-start:auto;text-align:end;flex:none}
.clock div{font-family:var(--f-head);font-weight:800;font-size:20px;line-height:1.2}
.clock div small{font-family:var(--f-body);font-weight:500;font-size:11px}
.clock>small{display:block;font-size:11.5px;color:var(--head-muted)}

main{max-width:720px;margin:0 auto;padding:18px 14px 16px}

/* Summary tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 4px;display:flex;flex-direction:column;align-items:center;cursor:pointer;font-size:12.5px;color:var(--muted)}
.tile .n{font-family:var(--f-head);font-weight:800;font-size:21px;color:var(--ink);line-height:1.3}
.tile.t-bad .n{color:var(--bad)}.tile.t-warn .n{color:var(--warn)}.tile.t-good .n{color:var(--good)}
.tile.on{border-color:var(--brand);background:var(--soft);color:var(--ink)}

.tools{display:flex;gap:8px;margin:12px 0 0}
.tools input{flex:1.4;min-width:0}.tools select{flex:1;min-width:0}
input,select,textarea{height:44px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 12px;font-size:16px;width:100%}
textarea{height:auto;padding:10px 12px;resize:vertical}

.list{list-style:none;padding:0;margin:12px 0;display:grid;gap:8px}
.item{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);
  border-inline-start:4px solid var(--good);border-radius:14px;padding:10px 12px;cursor:pointer}
.item.st-bad{border-inline-start-color:var(--bad)}.item.st-warn{border-inline-start-color:var(--warn)}.item.st-none{border-inline-start-color:var(--line)}
.thumb{width:46px;height:46px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-family:var(--f-head);font-weight:800;font-size:18px;color:var(--sun)}
.body{min-width:0}
.body b,.crow b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.due{text-align:end}
.due small{display:block;color:var(--muted);font-size:11.5px;margin-top:3px;white-space:nowrap}
.pill{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--good-bg);color:var(--good);white-space:nowrap}
.st-bad .pill,.pill.p-bad{background:var(--bad-bg);color:var(--bad)}
.st-warn .pill,.pill.p-warn{background:var(--warn-bg);color:var(--warn)}
.st-none .pill{background:var(--surface2);color:var(--muted)}

.grp h3{display:flex;justify-content:space-between;align-items:baseline;margin:20px 2px 0;font-family:var(--f-head);font-size:15px}
.grp h3 small{font-family:var(--f-body);font-weight:400;font-size:12.5px;color:var(--muted)}
.crow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;cursor:pointer}
.crow>div:first-child{min-width:0}
.flags{display:flex;flex-direction:column;gap:4px;align-items:flex-end}

.empty{text-align:center;color:var(--muted);padding:30px 10px;list-style:none}
.empty .btn{margin-top:12px}

/* Buttons */
.btn{height:46px;border:none;border-radius:12px;padding:0 18px;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid currentColor}
.btn.sm{height:36px;font-size:14px;padding:0 14px;border-radius:10px}
.link{background:none;border:none;padding:4px 0;color:var(--brand);font-weight:700;font-size:13.5px;cursor:pointer}
.link.danger{color:var(--bad)}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}

/* Messages */
.compose{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:14px}
.compose textarea{border:none;background:transparent;padding:8px 2px;min-height:72px}
.compose textarea:focus-visible{outline:none}
.compose:focus-within{border-color:var(--brand)}
.compose .row{display:flex;justify-content:flex-end}
.mlist{display:grid;gap:10px;margin-top:12px}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.msg.mgr{border-inline-start:4px solid var(--sun)}
.msg header{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px}
.who{font-weight:700}
.role{background:var(--sun);color:var(--sun-ink);border-radius:6px;padding:0 7px;font-size:11.5px;font-weight:700}
.kind{color:var(--muted)}
.k-task .kind{color:var(--brand);font-weight:700}.k-ask .kind{color:var(--warn);font-weight:700}
.msg time,.rep time{margin-inline-start:auto;color:var(--muted);font-size:12px}
.msg p{margin:6px 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.done p{color:var(--muted);text-decoration:line-through}
.check{display:flex;align-items:center;gap:8px;width:100%;background:var(--surface2);border:none;border-radius:10px;padding:8px 10px;font-size:14px;cursor:pointer;text-align:start}
.check .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);display:grid;place-items:center;font-weight:800;flex:none}
.check.on{background:var(--good-bg);color:var(--good)}.check.on .box{background:var(--good);border-color:var(--good);color:#fff}
.msg footer{display:flex;gap:16px;margin-top:6px}
.replies{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;display:grid;gap:8px}
.rep{background:var(--surface2);border-radius:10px;padding:8px 10px;font-size:14px}
.rep>div{display:flex;gap:6px;align-items:center}
.rep p{margin:2px 0 0}
.rrow{display:flex;gap:8px}.rrow input{height:38px}

/* Info */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-family:var(--f-head);font-size:15px}
.card p{margin:4px 0}
.card ol{margin:6px 0;padding-inline-start:22px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;height:38px;border:none;border-radius:9px;background:transparent;cursor:pointer;font-size:14.5px}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:6px 0 0}
.stats div{background:var(--surface2);border-radius:10px;padding:8px 12px}
.stats dt{font-size:12.5px;color:var(--muted)}.stats dd{margin:0;font-family:var(--f-head);font-weight:800;font-size:19px}

.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:12px 8px}
.sw{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:13px;cursor:pointer;color:var(--ink);padding:2px}
.sw i{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);display:block}
.sw.on i{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--sun)}
.sw.on span{font-weight:700}
.fonts{display:grid;gap:8px}
.fo{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface2);border:2px solid transparent;border-radius:12px;padding:10px 14px;cursor:pointer;text-align:start}
.fo b{font-size:18px;font-weight:400}
.fo small{color:var(--muted);font-size:12.5px;flex:none}
.fo.on{border-color:var(--sun);background:var(--surface)}
.setcard{padding:4px 16px}
.setrow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;padding:12px 0;cursor:pointer;text-align:start}
.setrow+.setrow{border-top:1px solid var(--line)}
.sw-mini{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);flex:none;display:block}
.fo-mini{width:36px;height:36px;border-radius:10px;background:var(--surface2);flex:none;display:grid;place-items:center;font-style:normal;font-size:16px}
.st{flex:1;display:flex;flex-direction:column;line-height:1.4}
.st b{font-family:var(--f-head);font-size:15px}.st small{color:var(--muted);font-size:13px}
.chev{color:var(--muted);font-size:24px;line-height:1}
.sh-body .swatches{padding:6px 0 4px}
.ic-mini{width:36px;height:36px;border-radius:10px;background:var(--surface2);flex:none;display:grid;place-items:center;color:var(--sun)}
.ic-mini svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fo.th{justify-content:flex-start}
.fo.th .ic-mini{background:var(--surface)}
.fo.th.on .ic-mini{background:var(--surface2)}
body{color:var(--page-ink)}
.card,.tile,.item,.crow,.msg,.compose,.sheet,.chip,input,select,textarea,.cbox,#nav,.fo{color:var(--ink)}
.empty,.grp h3 small{color:var(--page-muted)}
.sheet .empty{color:var(--muted)}
.chip.on{color:var(--brand-ink)}
.tile{color:var(--muted)}.tile.on{color:var(--ink)}
.trow{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.mode-btn{width:28px;height:28px;border-radius:50%;border:1px solid var(--head-line);background:transparent;color:#C8203F;display:grid;place-items:center;padding:0;cursor:pointer}
.mode-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){.top{transition:none}}
.tiles.t3{grid-template-columns:repeat(3,1fr)}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px;margin-top:12px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px 4px;font-size:12.5px;cursor:pointer}
.qa i{width:40px;height:40px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;color:var(--sun)}
.qa svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sec{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-head);font-size:15px;margin:22px 2px 0}
.sec+.list{margin-top:10px}.sec+.empty{padding:18px 10px}
.minis{display:grid;gap:8px;margin-top:10px}
.mini{display:block;width:100%;text-align:start;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer}
.mini.mgr{border-inline-start:4px solid var(--sun)}
.mh{display:flex;align-items:center;gap:6px;font-size:13px}
.mh time{margin-inline-start:auto;color:var(--muted);font-size:12px}
.mt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14.5px;margin-top:3px}
.pinov{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
.pinbox{width:min(320px,100%);text-align:center}
.pinlogo{width:72px;height:72px;border-radius:50%;box-shadow:0 0 0 3px var(--surface),0 0 0 5px #C8203F}
.pinbox h2{font-family:var(--f-head);font-size:18px;margin:16px 0 14px}
.dots{display:flex;justify-content:center;gap:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.dots i.on{background:var(--sun);border-color:var(--sun)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.dots.shake{animation:none}}
.pinmsg{min-height:24px;color:var(--bad);font-size:14px;margin:10px 0}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;direction:ltr}
.keys button{height:64px;border-radius:50%;width:64px;margin:0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:24px;cursor:pointer}
.keys button:active{background:var(--surface2)}
.keys .kx{border:none;background:none;font-size:13px;color:var(--muted);direction:rtl}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:14.5px}
.tg input{position:absolute;opacity:0;width:1px;height:1px}
.tg input+i{flex:none;width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .15s}
.tg input+i::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:right .15s}
.tg input:checked+i{background:var(--good)}
.tg input:checked+i::after{right:21px}
.tg input:focus-visible+i{outline:2px solid var(--brand);outline-offset:2px}
.tg input:disabled+i{opacity:.5}
label.fo{cursor:pointer}
.snap{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:12px;padding:10px 12px}
.snap .st{min-width:0}.snap .x{width:34px;height:34px;font-size:18px;background:var(--surface)}
.ava{width:36px;height:36px;border-radius:50%;background:var(--sun);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700;flex:none}
.fo.th .pill{margin-inline-start:auto}
.howto{background:var(--surface2);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:14px}
.howto ol{margin:6px 0;padding-inline-start:20px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3 div{background:var(--surface2);border-radius:12px;padding:8px;text-align:center}
.stat3 b{display:block;font-size:20px}.stat3 small{color:var(--muted);font-size:12px}
.tg input:checked+i.tg-bad{background:var(--bad)}
.blocked{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:700;font-size:14px}
.cts{display:grid;gap:8px;margin-top:8px}
.setrow .cbtn{width:38px;height:38px}
.ct{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:12px;padding:9px 10px}
.ct[data-edit]{cursor:pointer}
.ct .st{min-width:0}.ct .st b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbtn{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;margin-inline-start:auto}
.cbtn+.cbtn{margin-inline-start:0}
.cbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cbtn.call{background:#1E8E5A}.cbtn.wa{background:#25D366}
.groups{display:grid;gap:8px}
.gcard{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:12px;cursor:pointer}
.gcard .st{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.gl1,.gl2{display:flex;align-items:center;gap:8px}
.gl1 b{flex:1;font-family:var(--f-head);font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gl1 time{color:var(--muted);font-size:12px;flex:none}
.gl2 small{flex:1;color:var(--muted);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unread{flex:none;min-width:22px;height:22px;border-radius:11px;background:var(--sun);color:var(--sun-ink);font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.gava{flex:none;width:46px;height:46px;border-radius:50%;color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:19px}
.gnew{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:2px dashed var(--line);border-radius:16px;padding:10px 12px;margin-bottom:10px;color:inherit;font-weight:700;cursor:pointer}
.gnew i{width:36px;height:36px;border-radius:50%;background:var(--sun);color:#fff;display:grid;place-items:center}
.gnew svg,.ghead .x svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.ghead{display:flex;align-items:center;gap:10px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:8px 10px;margin-bottom:12px}
.ghead .st{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.ghead .st b{font-family:var(--f-head);font-size:16px}.ghead .st small{color:var(--muted);font-size:12.5px}
.ghead .gava{width:40px;height:40px;font-size:17px}
.gback{display:flex;align-items:center;gap:4px;height:36px;padding:0 10px 0 12px;border-radius:18px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font-size:13.5px;font-weight:700;cursor:pointer;flex:none}
.gback svg{width:18px;height:18px;fill:none;stroke:var(--sun);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.gback:active{background:var(--line)}
.xdel{color:var(--bad)}
.ghead .x{display:grid;place-items:center}
.gcolors{display:flex;flex-wrap:wrap;gap:10px}
.gc{width:36px;height:36px;border-radius:50%;border:none;cursor:pointer}
.gc.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.gtag{background:var(--surface2);border-radius:6px;padding:0 6px;font-size:11.5px;color:var(--muted)}
.cbox{text-align:center}
.cbox h3{margin:6px 0 4px;font-family:var(--f-head);font-size:17px}
.cbox p{color:var(--muted)}
.cwarn{width:52px;height:52px;border-radius:50%;background:var(--bad-bg);color:var(--bad);display:grid;place-items:center;margin:0 auto}
.cwarn svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.csure{display:flex;gap:10px;align-items:center;text-align:start;background:var(--surface2);border-radius:10px;padding:10px 12px;margin:0 0 14px;font-size:14px;cursor:pointer}
.csure input{width:20px;height:20px;flex:none;accent-color:var(--bad)}
.cbox .row{justify-content:center}.cbox .row .btn{flex:1}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.gtiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:600px){.gtiles{grid-template-columns:repeat(3,1fr)}}
.gtile{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:168px;padding:14px;border:none;border-radius:20px;cursor:pointer;text-align:start;color:#fff;
  background:linear-gradient(150deg,var(--gc) 0%,color-mix(in srgb,var(--gc) 62%,#000) 100%);box-shadow:0 6px 16px color-mix(in srgb,var(--gc) 30%,transparent)}
.gtile::after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);inset-inline-start:-34px;bottom:-46px}
.gtile:active{transform:scale(.98)}
.gbig{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:800;font-size:24px;margin-bottom:8px}
.gtile b{font-family:var(--f-head);font-size:16.5px;line-height:1.3;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gmem{font-size:12px;opacity:.85}
.glast{margin-top:auto;padding-top:8px;width:100%;display:flex;flex-direction:column;font-size:12.5px;opacity:.95;position:relative;z-index:1}
.glast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.glast time{font-size:11px;opacity:.75}
.gun{position:absolute;top:12px;inset-inline-end:12px;min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:#fff;color:var(--gc);font-size:12.5px;font-weight:800;display:grid;place-items:center;z-index:1}
.gadd{background:var(--surface);color:var(--ink);border:2px dashed var(--line);box-shadow:none;align-items:center;justify-content:center;text-align:center}
.gadd::after{display:none}
.gadd i{width:52px;height:52px;border-radius:50%;background:var(--sun);color:#fff;display:grid;place-items:center;margin-bottom:8px}
.gadd svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.gadd small{color:var(--muted);font-size:12px}
@media (prefers-reduced-motion:reduce){.gtile:active{transform:none}}
.gbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.gbar h3{margin:0;font-family:var(--f-head);font-size:17px}
.vsw{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px 14px;padding:2px 14px}
.vsw::-webkit-scrollbar{display:none}

.compose .row{gap:8px;align-items:center}

.mtabs button.on{background:var(--sun);color:#fff;font-weight:700}
.mtabs i{font-style:normal;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;font-size:11.5px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.mtabs button.on i{background:#fff;color:var(--sun)}
.fo .ava,.fo img.ava{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none}
.gbar h3{flex:none!important}
.gbar .mtabs{flex:1;margin:0;padding:3px;gap:3px;border-radius:12px;min-width:0}
.gbar .mtabs button{height:34px;font-size:13.5px;gap:5px;padding:0 6px;min-width:0}
.gbar .mtabs svg{width:16px;height:16px;flex:none}
.gbar .mtabs i{min-width:18px;height:18px;font-size:10.5px}
.gnewbtn.gnr{width:42px;height:42px;padding:0;justify-content:center;border-radius:50%;flex:none}
.gnewbtn.gnr svg{width:20px;height:20px}
@media (max-width:360px){.gbar h3{display:none}}
.top{flex-wrap:wrap;row-gap:8px}
.ptimes{flex-basis:100%;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;border-top:1px solid var(--head-line);padding-top:7px;margin-top:2px}
.pt{display:flex;flex-direction:column;align-items:center;line-height:1.25;padding:3px 0 4px;border-radius:10px}
.pt small{font-size:10.5px;color:var(--head-muted)}
.pt b{font-size:13px;font-weight:700;direction:ltr;letter-spacing:.2px}
.pt.sr{opacity:.65}
.pt.nx{background:color-mix(in srgb,#C8203F 11%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,#C8203F 35%,transparent)}
.pt.nx small,.pt.nx b{color:#C8203F}
.pt em{font-style:normal;font-size:9.5px;color:#C8203F;opacity:.85;white-space:nowrap}
.ptimes{gap:2px!important;padding-top:5px!important;margin-top:0!important}
.top{row-gap:5px!important}
.pt{padding:2px 0 2px!important;border-radius:8px!important;line-height:1.15!important}
.pt small{font-size:9.5px!important}
.pt b{font-size:11.5px!important}
.pt em{font-size:8.5px!important}
.ptimes{padding-top:4px!important;gap:1px!important}
.top{row-gap:4px!important;padding-bottom:6px!important}
.pt{flex-direction:row!important;justify-content:center;gap:3px;padding:2px 0!important;border-radius:6px!important;flex-wrap:wrap}
.pt small{font-size:8.5px!important}
.pt b{font-size:10px!important}
.pt em{display:none}
.ptimes.cd .pt em{display:inline!important;font-size:8.5px}
.seg2{display:flex;background:var(--surface);border-radius:10px;padding:3px;gap:3px}
.seg2 button{flex:1;height:34px;border:none;border-radius:8px;background:none;color:var(--ink);cursor:pointer;font-size:14px}
.seg2 button.on{background:var(--sun);color:#fff;font-weight:700}
.ptrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.ptrow .st{flex:1;display:flex;flex-direction:column;line-height:1.3}.ptrow .st small{color:var(--muted);font-size:12px;text-align:end}
.ptrow button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;cursor:pointer}
.ptv{min-width:34px;text-align:center;font-weight:700}
.gsec select{background:var(--surface)}
.authgate{position:fixed;inset:0;z-index:85;background:var(--bg);display:grid;place-items:center;overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
.authbox{width:min(380px,100%);display:grid;gap:12px;text-align:center;background:var(--surface);border-radius:22px;padding:24px 20px;box-shadow:0 10px 40px rgba(20,28,51,.12)}
.authbox .field{text-align:start}
.authlogo{width:84px;height:84px;border-radius:50%;margin:0 auto;box-shadow:0 0 0 3px var(--surface),0 0 0 5px #C8203F}
.authbox h2{margin:4px 0 0;font-family:var(--f-head);font-size:22px}
.authbox p{margin:0;font-size:14px}
.autherr{color:var(--bad)!important;min-height:20px;font-weight:600}
.authhelp{display:grid;gap:6px;margin-top:4px}
.swr.fo-w{border-radius:12px}.swr.fo-w .swbg{border-radius:12px}
.swr.fo-w>.fo{width:100%;position:relative;z-index:1;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.regadd{width:100%;justify-content:center;height:46px;border-radius:14px}
.wrow2{cursor:default}
/* FAB + nav */
.fab{position:fixed;inset-inline-end:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:none;
  background:var(--sun);color:var(--sun-ink);font-size:32px;line-height:1;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:15}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{position:relative;background:none;border:none;color:var(--muted);padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;cursor:pointer}
#nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--brand);font-weight:700}
.badge{position:absolute;top:4px;left:calc(50% - 22px);background:var(--bad);color:#fff;border-radius:999px;font-style:normal;font-size:11px;font-weight:700;min-width:18px;height:18px;line-height:18px;padding:0 5px;text-align:center}

/* Sheet */
.scrim,.cscrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.cscrim{z-index:50;align-items:center;padding:20px}
.sheet{background:var(--surface);width:min(720px,100%);max-height:90vh;max-height:90dvh;overflow:auto;border-radius:20px 20px 0 0;
  padding:6px 16px calc(22px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.handle{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 6px}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-6px;background:var(--surface);padding:6px 0;z-index:1}
.sh-head h2{margin:0;font-family:var(--f-head);font-size:18px}
.x{width:38px;height:38px;border-radius:50%;border:none;background:var(--surface2);font-size:22px;cursor:pointer;flex:none}
.form{display:grid;gap:12px}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.actions .btn{flex:1}
.sub{font-family:var(--f-head);font-size:15px;margin:18px 0 0}
.state{display:flex;gap:8px;align-items:center;margin:0}
.cbox{background:var(--surface);border-radius:16px;padding:18px;width:min(360px,100%)}
.cbox p{margin:0 0 14px}
.cbox .row{display:flex;gap:8px;justify-content:flex-end}

.cnt-h,.cnt{display:grid;grid-template-columns:1fr 56px 78px 56px;gap:8px;align-items:center}
.cnt-h{font-size:12px;color:var(--muted);padding:0 4px;margin-top:8px}
.cnt{padding:8px 4px;border-bottom:1px solid var(--line)}
.cnt>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt input{height:38px;text-align:center;padding:0 4px}
.cnt .d{text-align:center;font-weight:700;font-size:14px}
.d.neg{color:var(--bad)}.d.pos{color:var(--warn)}
.check-line{display:flex;gap:10px;align-items:center;font-size:14.5px;margin:12px 0}
.check-line input{width:20px;height:20px}

#toast{position:fixed;left:50%;bottom:calc(152px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

<script src="config.js"></script>
<div id="fbLogin" class="fbl" hidden></div>
<script>
/* ===== Standalone layer: Firebase Auth + Firestore behind the app's storage API ===== */
(()=>{
  window.__STANDALONE=true;
  const $=s=>document.querySelector(s);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const box=$('#fbLogin');
  const fail=(msg)=>{box.hidden=false;box.innerHTML=`<div class="fbbox"><img class="fblogo" src="icon-192.png" alt=""><h2>هەڵەیەک ڕوویدا</h2><p>${esc(msg)}</p><button class="fbbtn" onclick="location.reload()">دووبارە هەوڵ بدەرەوە</button></div>`};
  if(!window.firebase||!window.FIREBASE_CONFIG){fail('پەیوەندی بە ئینتەرنێتەوە نییە یان فایلی config.js بوونی نییە.');window.claude={use:()=>new Promise(()=>{})};return}
  let app,auth,fs;
  try{app=firebase.initializeApp(window.FIREBASE_CONFIG);auth=firebase.auth();fs=firebase.firestore();try{fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}}
  catch(e){fail('ڕێکخستنی Firebase هەڵەیە (config.js).');return}
  window.__fb={app,auth,fs};
  let ctx=null,resolveReady;const ready=new Promise(r=>resolveReady=r);
  const ERR={'auth/invalid-credential':'ئیمەیڵ یان وشەی نهێنی هەڵەیە','auth/wrong-password':'ئیمەیڵ یان وشەی نهێنی هەڵەیە','auth/user-not-found':'ئیمەیڵ یان وشەی نهێنی هەڵەیە','auth/invalid-email':'ئیمەیڵەکە دروست نییە','auth/too-many-requests':'هەوڵی زۆر درا، کەمێک چاوەڕێ بکە','auth/network-request-failed':'پەیوەندی بە ئینتەرنێتەوە نییە','auth/email-already-in-use':'ئەم ئیمەیڵە پێشتر بەکارهاتووە','auth/weak-password':'وشەی نهێنی دەبێت لانیکەم ٦ پیت بێت','auth/api-key-not-valid.-please-pass-a-valid-api-key.':'کلیلی Firebase هەڵەیە، config.js بپشکنە','auth/invalid-api-key':'کلیلی Firebase هەڵەیە، config.js بپشکنە','auth/unauthorized-domain':'ئەم ماڵپەڕە لە Firebase ڕێگەی پێ نەدراوە (Authorized domains)'};
  const em=e=>ERR[e&&e.code]||('هەڵە: '+((e&&e.code)||'نەزانراو'));
  async function hasOwner(){try{const d=await fs.doc('meta/owner').get();return d.exists}catch(e){return null}}
  async function showLogin(){
    const owner=await hasOwner();
    let mode=owner===false?'signup':'login';
    const draw=()=>{box.hidden=false;document.body.classList.add('lock');
      box.innerHTML=`<form class="fbbox" novalidate><img class="fblogo" src="icon-192.png" alt="">
        <h2>${mode==='signup'?'دروستکردنی ئەکاونتی بەڕێوەبەر':'چوونەژوورەوە'}</h2>
        <p>${mode==='signup'?'یەکەم جارە ئەپەکە دەکرێتەوە. ئەکاونتی بەڕێوەبەر دروست بکە.':'بە ئیمەیڵ و وشەی نهێنییەکەت بچۆ ژوورەوە.'}</p>
        <label><span>ئیمەیڵ</span><input name="email" type="email" dir="ltr" autocomplete="email" required></label>
        <label><span>وشەی نهێنی</span><input name="pw" type="password" dir="ltr" autocomplete="${mode==='signup'?'new-password':'current-password'}" required></label>
        ${mode==='signup'?'<label><span>دووبارەکردنەوەی وشەی نهێنی</span><input name="pw2" type="password" dir="ltr" autocomplete="new-password"></label>':''}
        <p class="fberr" role="alert"></p>
        <button class="fbbtn" type="submit">${mode==='signup'?'دروستکردن':'چوونەژوورەوە'}</button>
        ${mode==='login'?'<button class="fblink" type="button" data-x="reset">وشەی نهێنیت لەبیرچووە؟</button>':''}
        ${owner===false&&mode==='login'?'<button class="fblink" type="button" data-x="signup">دروستکردنی ئەکاونتی بەڕێوەبەر</button>':''}
        ${mode==='signup'?'<button class="fblink" type="button" data-x="login">ئەکاونتم هەیە، چوونەژوورەوە</button>':''}
      </form>`;
      const f=box.querySelector('form'),er=box.querySelector('.fberr');
      setTimeout(()=>f.email.focus(),150);
      f.onclick=async e=>{const b=e.target.closest('[data-x]');if(!b)return;const x=b.dataset.x;
        if(x==='reset'){const m=f.email.value.trim();if(!m){er.textContent='سەرەتا ئیمەیڵەکەت بنووسە';return}
          try{await auth.sendPasswordResetEmail(m);er.style.color='#1E8E5A';er.textContent='بەستەری گۆڕینی وشەی نهێنی نێردرا بۆ ئیمەیڵەکەت'}catch(err){er.textContent=em(err)}return}
        mode=x;draw()};
      f.onsubmit=async e=>{e.preventDefault();er.style.color='';er.textContent='';const m=f.email.value.trim().toLowerCase(),p=f.pw.value;
        if(!m||!p){er.textContent='ئیمەیڵ و وشەی نهێنی بنووسە';return}
        if(mode==='signup'&&p!==f.pw2.value){er.textContent='دوو وشە نهێنییەکە وەک یەک نین';return}
        const b=f.querySelector('[type=submit]');b.disabled=true;
        try{if(mode==='signup')await auth.createUserWithEmailAndPassword(m,p);else await auth.signInWithEmailAndPassword(m,p)}
        catch(err){er.textContent=em(err);b.disabled=false}};
    };
    draw();
  }
  function denied(email){box.hidden=false;document.body.classList.add('lock');
    box.innerHTML=`<div class="fbbox"><img class="fblogo" src="icon-192.png" alt=""><h2>ڕێگەت پێ نەدراوە</h2><p>ئەکاونتی <b dir="ltr">${esc(email)}</b> لە لیستی کارمەندانی هەفتەبازاڕی سیروان نییە. پەیوەندی بە بەڕێوەبەر بکە.</p><button class="fbbtn" id="fbout">چوونەدەرەوە</button></div>`;
    box.querySelector('#fbout').onclick=()=>auth.signOut().then(()=>location.reload())}
  let started=false;
  auth.onAuthStateChanged(async u=>{
    if(!u){if(started){location.reload();return}showLogin();return}
    box.hidden=false;box.innerHTML='<div class="fbbox"><img class="fblogo" src="icon-192.png" alt=""><p>چوونەژوورەوە…</p></div>';
    const email=(u.email||'').toLowerCase();window.__fbEmail=email;
    try{
      let od=await fs.doc('meta/owner').get();
      if(!od.exists){await fs.doc('meta/owner').set({uid:u.uid,email,at:Date.now()});od=await fs.doc('meta/owner').get()}
      const owner=od.exists&&od.data().uid===u.uid;
      let allowed=owner;if(!owner){try{allowed=(await fs.doc('allow/'+email).get()).exists}catch(e){allowed=false}}
      if(!allowed){denied(email);return}
      ctx={uid:u.uid,email,owner};
    }catch(e){fail(e&&e.code==='permission-denied'?'یاساکانی داتابەیس (Firestore Rules) دانەنراون یان هەڵەن.':'نەتوانرا پەیوەندی بە داتابەیسەوە بکرێت.');return}
    box.hidden=true;box.innerHTML='';if(!document.querySelector('.scrim'))document.body.classList.remove('lock');
    started=true;resolveReady();
  });
  const userShim={id:async()=>ctx.uid,isOwner:async()=>ctx.owner,canEdit:async()=>ctx.owner,can:async()=>true,
    profiles:async ids=>{const o={};(ids||[]).forEach(i=>o[i]={name:'',avatarUrl:''});return o}};
  window.claude={use:async n=>{await ready;if(n==='db')return fs;if(n==='user')return userShim;return null}};
  window.__fbCreateUser=async(email,pw,name)=>{
    const sec=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(window.FIREBASE_CONFIG,'sec');
    try{await sec.auth().createUserWithEmailAndPassword(email,pw)}catch(e){if(e.code!=='auth/email-already-in-use')throw e}
    finally{try{await sec.auth().signOut()}catch(e){}}
    await fs.doc('allow/'+email.toLowerCase()).set({name,at:Date.now()});
  };
  if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>

<script>

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};

const isoOf=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function fmtDate(iso){if(!iso)return'';const[y,m,d]=iso.split('-');return d+'/'+m+'/'+y}
function daysLeft(iso){const t=new Date();t.setHours(0,0,0,0);const[y,m,d]=iso.split('-').map(Number);return Math.round((new Date(y,m-1,d)-t)/864e5)}
function status(p){if(!p.expiry)return'none';const n=daysLeft(p.expiry);return n<0?'bad':n<=WARN_DAYS?'warn':'good'}
function dayLabel(p){if(!p.expiry)return'بێ بەروار';const n=daysLeft(p.expiry);if(n<0)return'بەسەرچووە';if(n===0)return'ئەمڕۆ بەسەردەچێت';return ku(n)+' ڕۆژی ماوە'}
function ago(ts){const s=(Date.now()-ts)/1000;if(s<60)return'ئێستا';if(s<3600)return ku(Math.floor(s/60))+' خولەک لەمەوبەر';if(s<86400)return ku(Math.floor(s/3600))+' کاتژمێر لەمەوبەر';return fmtDate(isoOf(ts))}

/* ---------- Store: shared (db) or this device only ---------- */
const Store={db:null,local:{},cbs:{},
  sub(col,cb,opt={}){
    if(this.db){
      let q=this.db.collection(col);
      if(opt.order)q=q.orderBy(opt.order,'desc');
      if(opt.limit)q=q.limit(opt.limit);
      return q.onSnapshot(s=>cb(s.docs.map(d=>Object.assign({id:d.id},d.data()))),
        e=>{console.warn(col,e);if(e&&e.code!=='revoked')toast('وەرگرتنی داتا ڕاوەستا، پەڕەکە نوێ بکەرەوە')});
    }
    let a=[];try{a=JSON.parse(lsGet('sirwan:'+col)||'[]')}catch(e){}
    this.local[col]=Array.isArray(a)?a:[];this.cbs[col]={cb,opt};this.emit(col);return()=>{};
  },
  emit(col){const{cb,opt}=this.cbs[col];const a=this.local[col].slice();if(opt.order)a.sort((x,y)=>(y[opt.order]||0)-(x[opt.order]||0));cb(a)},
  persist(col){lsSet('sirwan:'+col,JSON.stringify(this.local[col]));this.emit(col)},
  async add(col,data){if(this.db){const r=await this.db.collection(col).add(data);return r.id}
    const id=uid();this.local[col].push(Object.assign({id},data));this.persist(col);return id},
  async upd(col,id,patch){if(this.db)return this.db.doc(col+'/'+id).update(patch);
    const a=this.local[col],i=a.findIndex(x=>x.id===id);if(i>-1){a[i]=Object.assign({},a[i],patch);this.persist(col)}},
  async put(col,id,data){if(this.db)return this.db.doc(col+'/'+id).set(data);
    const a=this.local[col]||(this.local[col]=[]),i=a.findIndex(x=>x.id===id),row=Object.assign({},data,{id});if(i>-1)a[i]=row;else a.push(row);if(this.cbs[col])this.persist(col);else lsSet('sirwan:'+col,JSON.stringify(a))},
  async del(col,id){if(this.db)return this.db.doc(col+'/'+id).delete();
    this.local[col]=this.local[col].filter(x=>x.id!==id);this.persist(col)}
};
async function run(fn,ok){
  try{await fn();if(ok)toast(ok);return true}
  catch(e){console.warn(e);const c=e&&e.code;
    toast(c==='invalid_argument'?'ناتوانیت ئەم گۆڕانکارییە بکەیت، دەسەڵاتی نووسینت نییە':c==='quota_exceeded'?'شوێنی داتا پڕ بووە، هەندێک تۆماری کۆن بسڕەوە':'هەڵەیەک ڕوویدا، دووبارە هەوڵ بدەرەوە');
    return false}
}

/* ---------- Prayer times: Halabja (MWL 18/17, Asr Shafi'i) ---------- */
const PCITIES=[['halabja','هەڵەبجەی شەهید',35.1778,45.9861],['sirwan','سیروان',35.2542,45.9400],['sulaimani','سلێمانی',35.5613,45.4374],['erbil','هەولێر',36.1911,44.0092],['duhok','دهۆک',36.8669,42.9503],['kirkuk','کەرکووک',35.4681,44.3922],['penjwen','پێنجوێن',35.6233,45.9458],['ranya','ڕانیە',36.2551,44.8851],['kalar','کەلار',34.6292,45.3222],['chamchamal','چەمچەماڵ',35.5333,44.8333],['soran','سۆران',36.6528,44.5442],['zakho','زاخۆ',37.1440,42.6820]];
const PMETH=[['mwl','ڕابیتەی جیهانی ئیسلامی',18,17,0],['egypt','دەستەی گشتیی میسری',19.5,17.5,0],['karachi','زانکۆی کەراچی',18,18,0],['umm','ئوم القرا (مەککە)',18.5,0,90]];
function pcfg(){let o={};try{o=JSON.parse(lsGet('sirwan:pt')||'{}')}catch(e){}return Object.assign({city:'halabja',meth:'mwl',asr:1,show:true,cd:false,off:{}},o)}
function psave(p){lsSet('sirwan:pt',JSON.stringify(p));ptDay='';drawPrayers();const h=$('.top');if(h)document.documentElement.style.setProperty('--hh',h.offsetHeight+'px')}
let PLOC={lat:35.1778,lng:45.9861,tz:3};
const PNAMES=[['fajr','بەیانی'],['sunrise','خۆرهەڵاتن'],['dhuhr','نیوەڕۆ'],['asr','عەسر'],['maghrib','ئێوارە'],['isha','خەوتنان']];
const dsin=d=>Math.sin(d*Math.PI/180),dcos=d=>Math.cos(d*Math.PI/180),dtan=d=>Math.tan(d*Math.PI/180);
const darcsin=x=>Math.asin(x)*180/Math.PI,darccos=x=>Math.acos(Math.max(-1,Math.min(1,x)))*180/Math.PI,darctan2=(y,x)=>Math.atan2(y,x)*180/Math.PI,darccot=x=>Math.atan(1/x)*180/Math.PI;
const fixA=a=>{a=a-360*Math.floor(a/360);return a<0?a+360:a},fixH=a=>{a=a-24*Math.floor(a/24);return a<0?a+24:a};
function prayerTimes(date){
  const C=pcfg();const city=PCITIES.find(c=>c[0]===C.city)||PCITIES[0];PLOC={lat:city[2],lng:city[3],tz:3};const ME=PMETH.find(m=>m[0]===C.meth)||PMETH[0];
  const y=date.getFullYear(),m=date.getMonth()+1,d=date.getDate();
  const Y=m<=2?y-1:y,M=m<=2?m+12:m,A=Math.floor(Y/100),B=2-A+Math.floor(A/4);
  const jd=Math.floor(365.25*(Y+4716))+Math.floor(30.6001*(M+1))+d+B-1524.5-PLOC.lng/360;
  const sun=t=>{const D=jd+t-2451545,g=fixA(357.529+0.98560028*D),q=fixA(280.459+0.98564736*D),L=fixA(q+1.915*dsin(g)+0.020*dsin(2*g)),e=23.439-0.00000036*D;
    const RA=darctan2(dcos(e)*dsin(L),dcos(L))/15;return{decl:darcsin(dsin(e)*dsin(L)),eqt:q/15-fixH(RA)}};
  const mid=t=>fixH(12-sun(t).eqt);
  const T=(ang,t,ccw)=>{const dc=sun(t).decl;const v=darccos((-dsin(ang)-dsin(dc)*dsin(PLOC.lat))/(dcos(dc)*dcos(PLOC.lat)))/15;return mid(t)+(ccw?-v:v)};
  const asrT=t=>{const dc=sun(t).decl;const ang=-darccot((C.asr===2?2:1)+dtan(Math.abs(PLOC.lat-dc)));return T(ang,t,false)};
  let r={fajr:5/24,sunrise:6/24,dhuhr:12/24,asr:13/24,maghrib:18/24,isha:18/24};
  for(let i=0;i<2;i++){r={fajr:T(ME[2],r.fajr,true),sunrise:T(0.833,r.sunrise,true),dhuhr:mid(r.dhuhr),asr:asrT(r.asr),maghrib:T(0.833,r.maghrib,false),isha:ME[4]?0:T(ME[3],r.isha,false)};for(const k in r)r[k]/=24}
  if(ME[4])r.isha=r.maghrib+ME[4]/60/24;
  const off=PLOC.tz-PLOC.lng/15;const out={};for(const k in r){let h=r[k]*24+(k==='isha'&&ME[4]?0:0)+off;if(k==='dhuhr')h+=1/60;h+=((C.off||{})[k]||0)/60;out[k]=fixH(h)}
  return out;
}
const hm=h=>{let mins=Math.round(h*60);const hh=Math.floor(mins/60)%24,mm=mins%60;return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0')};
let ptDay='',ptCache=null;
function drawPrayers(){
  const el=$('#ptimes');if(!el)return;const C=pcfg();el.hidden=!C.show;el.classList.toggle('cd',!!C.cd);el.setAttribute('aria-label','کاتەکانی بانگ، '+((PCITIES.find(c=>c[0]===C.city)||PCITIES[0])[1]));if(!C.show)return;const now=new Date();const day=isoOf(now.getTime());
  if(day!==ptDay){ptDay=day;ptCache=prayerTimes(now)}
  const nowH=now.getHours()+now.getMinutes()/60+now.getSeconds()/3600;
  let next=PNAMES.find(([k])=>ptCache[k]>nowH);let left;
  if(next)left=ptCache[next[0]]-nowH;else{next=PNAMES[0];const tm=prayerTimes(new Date(now.getTime()+864e5));left=24-nowH+tm.fajr}
  const lm=Math.max(0,Math.round(left*60)),ls=lm>=60?Math.floor(lm/60)+':'+String(lm%60).padStart(2,'0'):lm+' خولەک';
  el.innerHTML=PNAMES.map(([k,n])=>`<div class="pt${k===next[0]?' nx':''}${k==='sunrise'?' sr':''}"><small>${n}</small><b>${hm(ptCache[k])}</b>${k===next[0]?`<em>ماوە ${ls}</em>`:''}</div>`).join('');
}


function ptSheet(){

  const sh=openSheet('کاتەکانی بانگ',`
    <label class="tg ntg"><span class="st"><b>پیشاندان لە هێدەر</b><small>شریتی کاتەکان لە سەرەوەی بەرنامەکە</small></span><input type="checkbox" data-pt="show" ${C.show?'checked':''}><i aria-hidden="true"></i></label>

    <div class="gsec" style="margin-top:12px"><h4>شار</h4><select data-pt="city">${PCITIES.map(c=>`<option value="${c[0]}" ${C.city===c[0]?'selected':''}>${c[1]}</option>`).join('')}</select></div>
    <div class="gsec" style="margin-top:10px"><h4>شێوازی ژمێردن</h4><select data-pt="meth">${PMETH.map(m=>`<option value="${m[0]}" ${C.meth===m[0]?'selected':''}>${m[1]}</option>`).join('')}</select>
      <h4 style="margin-top:4px">عەسر</h4><div class="seg2"><button type="button" data-asr="1" class="${C.asr!==2?'on':''}">شافیعی</button><button type="button" data-asr="2" class="${C.asr===2?'on':''}">حەنەفی</button></div></div>

      <div id="ptoff"></div></div>
    <button class="btn ghost" data-s="reset" style="width:100%;margin-top:12px">گەڕاندنەوە بۆ بنەڕەت</button>`);
  const drawOff=()=>{const c=pcfg();const t=prayerTimes(new Date());$('#ptoff',sh).innerHTML=PNAMES.map(([k,n])=>{const v=(c.off||{})[k]||0;return`<div class="ptrow"><span class="st"><b>${n}</b><small dir="ltr">${hm(t[k])}</small></span><button type="button" data-o="${k}" data-d="-1" aria-label="خولەکێک کەمتر">−</button><span class="ptv" dir="ltr">${v>0?'+':''}${v}</span><button type="button" data-o="${k}" data-d="1" aria-label="خولەکێک زیاتر">+</button></div>`}).join('')};
  drawOff();
  sh.addEventListener('change',e=>{const el=e.target.closest('[data-pt]');if(!el)return;const c=pcfg();c[el.dataset.pt]=el.type==='checkbox'?el.checked:el.value;psave(c);drawOff();if(S.tab==='info')refInfo()});
  sh.addEventListener('click',e=>{const c=pcfg();
    const a=e.target.closest('[data-asr]');if(a){c.asr=+a.dataset.asr;psave(c);$$('[data-asr]',sh).forEach(x=>x.classList.toggle('on',x===a));drawOff();return}
    const o=e.target.closest('[data-o]');if(o){c.off=Object.assign({},c.off);c.off[o.dataset.o]=Math.max(-30,Math.min(30,(c.off[o.dataset.o]||0)+(+o.dataset.d)));psave(c);drawOff();return}
    if(e.target.closest('[data-s="reset"]')){try{localStorage.removeItem('sirwan:pt')}catch(err){}psave(pcfg());closeSheet();ptSheet();if(S.tab==='info')refInfo()}});
}

function resolveNames(){
  if(!S.user)return;
  const ids=new Set();
  S.messages.forEach(m=>{ids.add(m.by);ids.add(m.doneBy);(m.replies||[]).forEach(r=>ids.add(r.by))});
  S.counts.forEach(k=>ids.add(k.by));S.staff.forEach(x=>ids.add(x.id));
  const miss=[...ids].filter(x=>x&&x!==S.me.id&&!(x in S.names));
  if(!miss.length)return;
  miss.forEach(i=>S.names[i]='');
  S.user.profiles(miss).then(ps=>{for(const k in ps){S.names[k]=ps[k].name||'';S.avatars[k]=ps[k].avatarUrl||''}refresh()}).catch(()=>{});
}

/* swipe right-to-left to delete a group */
let swipedAt=0;
function bindSwipe(w,el){
  let x0=0,y0=0,dx=0,active=false,dir=null,pid=null;
  const TH=()=>Math.min(110,w.offsetWidth*.35||90);
  const set=(x,anim)=>{el.style.transition=anim?'transform .22s ease':'none';el.style.transform=x?`translateX(${x}px)`:'';
    w.classList.toggle('to-l',x<0);w.classList.toggle('to-r',x>0);w.classList.toggle('arm',Math.abs(x)>=TH())};
  el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;x0=e.clientX;y0=e.clientY;dx=0;active=true;dir=null;pid=e.pointerId});
  el.addEventListener('pointermove',e=>{if(!active||e.pointerId!==pid)return;const mx=e.clientX-x0,my=e.clientY-y0;
    if(!dir){if(Math.abs(mx)<8&&Math.abs(my)<8)return;dir=Math.abs(mx)>Math.abs(my)?'h':'v';if(dir==='h'){try{el.setPointerCapture(pid)}catch(err){}w.classList.add('dragging')}}
    if(dir!=='h')return;dx=el.dataset.g==='general'?Math.max(0,mx):mx;const lim=w.offsetWidth*.8;set(Math.max(-lim,Math.min(lim,dx)),false)});
  const end=async()=>{if(!active)return;active=false;w.classList.remove('dragging');
    if(dir==='h'&&Math.abs(dx)>6)swipedAt=Date.now();
    const g=groupById(el.dataset.g);
    if(dir==='h'&&dx<=-TH()){set(-w.offsetWidth,true);const ok=await deleteGroup(g);if(!ok)set(0,true)}
    else if(dir==='h'&&dx>=TH()){set(0,true);groupForm(g)}
    else set(0,true)};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}
document.addEventListener('click',e=>{if(Date.now()-swipedAt<400&&e.target.closest('.swr')){e.stopPropagation();e.preventDefault()}},true);

const PINI='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l-1 6 4 4H6l4-4z"/><path d="M12 13v8"/></svg>';
const MAX_PINS=5;
function getPins(){try{const a=JSON.parse(lsGet('sirwan:pins')||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
const isPinned=id=>getPins().includes(id);
function pinIdx(id){const i=getPins().indexOf(id);return i<0?999:i}
function togglePin(id){let p=getPins();if(p.includes(id)){p=p.filter(x=>x!==id);toast('پین لابرا')}else{if(p.length>=MAX_PINS){toast('زۆرترین '+MAX_PINS+' گرووپ پین دەکرێت');return}p.push(id);toast('گرووپەکە پین کرا')}lsSet('sirwan:pins',JSON.stringify(p));refGroups()}
let pressAt=0;
function bindLongPress(el){
  let t=null,x0=0,y0=0;
  const cancel=()=>{clearTimeout(t);t=null;el.classList.remove('pressing')};
  el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;x0=e.clientX;y0=e.clientY;el.classList.add('pressing');
    t=setTimeout(()=>{t=null;el.classList.remove('pressing');pressAt=Date.now();if(navigator.vibrate){try{navigator.vibrate(25)}catch(err){}}groupMenu(groupById(el.dataset.g))},480)});
  el.addEventListener('pointermove',e=>{if(t&&(Math.abs(e.clientX-x0)>8||Math.abs(e.clientY-y0)>8))cancel()});
  el.addEventListener('pointerup',cancel);el.addEventListener('pointercancel',cancel);el.addEventListener('pointerleave',cancel);
  el.addEventListener('contextmenu',e=>{e.preventDefault();cancel();pressAt=Date.now();groupMenu(groupById(el.dataset.g))});
}
document.addEventListener('click',e=>{if(Date.now()-pressAt<700&&e.target.closest('[data-act="openG"]')){e.stopPropagation();e.preventDefault()}},true);
function groupMenu(g){

    !g.dm&&S.me.mgr&&S.canWrite&&g.id!=='general'&&['del','سڕینەوەی گرووپ',GI('trash'),'']].filter(Boolean);
  const sh=openSheet(g.name,`<div class="fonts">${acts.map(([k,l,ic,d])=>`<button class="fo th${k==='del'?' dangerrow':''}" data-gm="${k}"><i class="ic-mini">${ic}</i><span class="st"><b>${l}</b>${d?`<small>${d}</small>`:''}</span></button>`).join('')}</div>`);

    if(k==='pin')togglePin(g.id);else if(k==='read'){markRead(g.id);refresh()}else if(k==='set')groupForm(g);else if(k==='del')deleteGroup(g)});

async function squarePhoto(src){
  const img=src instanceof HTMLCanvasElement?src:await loadImgEl(src);
  const W=img.naturalWidth||img.width,H=img.naturalHeight||img.height,sz=Math.min(W,H);
  const c=document.createElement('canvas');c.width=c.height=320;c.getContext('2d').drawImage(img,(W-sz)/2,(H-sz)/2,sz,sz,0,0,320,320);
  return c.toDataURL('image/jpeg',.8);
}
function groupMembers(g){
  const staff=S.staff.filter(x=>!x.mgr&&(x.id!==S.me.id||!S.me.mgr));
  if(g.members==='all')return staff.map(x=>x.id);
  const out=[];(Array.isArray(g.members)?g.members:[]).forEach(t=>{if(t.startsWith('p:')){const st=S.staff.find(x=>x.claim===t.slice(2));out.push(st?st.id:t)}else out.push(t)});

const fontLoads={};
function loadFont(f){if(!f.g)return Promise.resolve();if(fontLoads[f.k])return fontLoads[f.k];
  fontLoads[f.k]=new Promise(res=>{const l=document.createElement('link');l.rel='stylesheet';l.dataset.f=f.k;l.href='https://fonts.googleapis.com/css2?family='+f.g+'&display=swap';l.onload=res;l.onerror=res;document.head.appendChild(l)});
  return fontLoads[f.k]}
const fontOK={};
async function hasKurdish(f){
  if(f.k in fontOK)return fontOK[f.k];
  if(!f.g)return fontOK[f.k]=true;
  try{await loadFont(f);await Promise.race([document.fonts.load('40px '+f.css,'ێڵڕۆە'),new Promise(r=>setTimeout(r,6000))])}catch(e){}
  const c=document.createElement('canvas').getContext('2d');let ok=true;
  for(const ch of 'ێڵڕۆ'){c.font='40px monospace';const a=c.measureText(ch).width;c.font='40px '+f.css+',monospace';const b=c.measureText(ch).width;if(Math.abs(a-b)<0.01){ok=false;break}}
  return fontOK[f.k]=ok}

async function prune(){
  const cut=Date.now()-30*864e5;const old=S.messages.filter(m=>m.at<cut);
  if(!old.length){toast('هیچ پەیامێکی کۆن نییە');return}
  if(!await confirmBox(ku(old.length)+' پەیامی کۆن بسڕدرێتەوە؟'))return;
  let n=0;for(const m of old){if(await run(()=>delMsg(m)))n++}
  toast(ku(n)+' پەیام سڕایەوە');
}

function tone(f,start,dur,{type='sine',vol=.18,to=null,attack=.01}={}){const t=actx.currentTime+start;const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur*.6);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur+.05)}
function playSound(k){if(!actx)return;try{if(actx.state==='suspended')actx.resume();
  switch(k){
    case'bell':tone(1046,0,1.4,{vol:.16});tone(2093,0,.9,{vol:.06});tone(3136,0,.5,{vol:.03});break;
    case'marimba':[523,659,784].forEach((f,i)=>{tone(f,i*.11,.35,{type:'triangle',vol:.2});tone(f*4,i*.11,.08,{vol:.04})});break;
    case'pop':tone(500,0,.16,{vol:.22,to:1300,attack:.005});tone(900,.12,.14,{vol:.12,to:1800,attack:.005});break;
    case'cash':tone(1568,0,.5,{type:'square',vol:.05});tone(2093,.12,.7,{type:'square',vol:.05});tone(4186,.12,.4,{vol:.03});break;
    case'soft':tone(440,0,.6,{vol:.14,attack:.08});tone(660,.18,.8,{vol:.12,attack:.08});break;
    default:tone(880,0,.35);tone(1320,.13,.35);
  }}catch(e){}}

  b.onclick=()=>{b.classList.remove('show');if(action)action()};

let seenMsgs=null;const seenReplies={};
function notifyMessages(list){
  if(seenMsgs===null){seenMsgs=new Set(list.map(m=>m.id));list.forEach(m=>seenReplies[m.id]=(m.replies||[]).length);return}
  const o=nset();const vis=new Set([...visibleGroups().map(g=>g.id),...myDMs()]);let fired=null;
  for(const m of list){
    const gid=m.groupId||'general';
    if(!seenMsgs.has(m.id)){seenMsgs.add(m.id);seenReplies[m.id]=(m.replies||[]).length;
      if(m.by===S.me.id||!vis.has(gid)||isMuted(gid))continue;
      const open=S.tab==='messages'&&S.grp===gid&&!document.hidden;if(open)continue;
      if(m.kind==='task'&&o.task)fired=fired||['ئەرکی نوێ: '+groupById(gid).name,who(m.by)+': '+previewText(m),'task',gid];
      else if(m.kind!=='task'&&o.msg)fired=fired||[groupById(gid).name,who(m.by)+': '+previewText(m),'msg',gid];
    }else{const n=(m.replies||[]).length,was=seenReplies[m.id]||0;seenReplies[m.id]=n;
      if(n>was&&m.by===S.me.id&&o.reply){const r=m.replies[n-1];if(r&&r.by!==S.me.id)fired=fired||['وەڵامی نوێ',who(r.by)+': '+r.text,'reply',gid]}}
  }
  if(fired){const[t,b,i,gid]=fired;notify(t,b,i,()=>{S.mf='all';S.grp=gid;goTab('messages')})}
}

/* ---------- Camera / microphone permissions ---------- */
const PST={granted:['ڕێگەپێدراوە','ok'],denied:['ڕێگە نەدراوە','no'],prompt:['هێشتا نەپرسراوە، کرتە بکە بۆ ڕێگەدان','ask'],unknown:['کرتە بکە بۆ پشکنین','ask'],unsupported:['ئەم مۆبایلە پشتگیری ناکات','no']};
const permCache={};
async function permState(n){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return'unsupported';
  if(permCache[n])return permCache[n];
  try{const r=await navigator.permissions.query({name:n});return r.state}catch(e){return'unknown'}
}
async function drawPerms(){for(const n of['camera','microphone']){const el=$(`[data-pst="${n}"]`);if(!el)continue;const st=await permState(n);const[t,c]=PST[st]||PST.unknown;el.textContent=t;el.className='pst '+c}}
async function askPerm(n){
  const st=await permState(n);
  if(st==='unsupported'){toast(PST.unsupported[0]);return}
  try{const s2=await navigator.mediaDevices.getUserMedia(n==='camera'?{video:true}:{audio:true});s2.getTracks().forEach(t=>t.stop());permCache[n]='granted';toast(n==='camera'?'ڕێگە بە کامێرا درا':'ڕێگە بە مایکرۆفۆن درا');drawPerms()}
  catch(e){permCache[n]='denied';drawPerms();
    openSheet(n==='camera'?'ڕێگەی کامێرا':'ڕێگەی مایکرۆفۆن',`<div class="ginfohead"><span class="gibig mini" style="background:var(--bad)">${VCI(n==='camera'?'cam':'mic')}</span><b>ڕێگە نەدرا</b><small>بەرنامەکە ناتوانێت ${n==='camera'?'کامێرا':'مایکرۆفۆن'} بەکاربهێنێت</small></div>
      <div class="howto"><b>بۆ ڕێگەدان لە ئەندرۆید</b><ol><li>ڕێکخستنی مۆبایلەکەت بکەرەوە (Settings).</li><li>Apps ← Claude ← Permissions.</li><li>${n==='camera'?'Camera':'Microphone'} بکە بە Allow.</li><li>بەرنامەکە دابخە و دووبارە بیکەرەوە.</li></ol>
      <small class="muted">ئەگەر لە وێبگەڕی Chrome بەکاری دەهێنیت: لە سەرەوە کرتە لە 🔒 بکە ← Permissions ← ${n==='camera'?'Camera':'Microphone'} ← Allow.</small></div>
      <p class="muted" style="font-size:13px;margin:10px 0 0">لەوانەیە ئەپی Claude بۆ هەندێک مۆبایل ئەم ڕێگەیە بە بەرنامەکان نەدات، تەنانەت ئەگەر ڕێگەت پێدابێت.</p>`)}
}


/* ---------- Employee sign-in gate (email + optional code) ---------- */

function authGate(){

    const me=S.staff.find(x=>x.id===S.me.id),em=(window.__fbEmail||'').toLowerCase();

/* PIN */
const hasPin=()=>!!lsGet('sirwan:pin');
async function hashPin(p){const t='sirwan-pin:'+p;
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))|0;return'f'+h}}
async function pinOK(p){return(await hashPin(p))===lsGet('sirwan:pin')}
function askPin(title,{cancel=true,validate=null}={}){
  return new Promise(res=>{
    const o=document.createElement('div');o.className='pinov';
    o.innerHTML=`<div class="pinbox"><img class="pinlogo" src="${$('.mark').src}" alt=""><h2>${esc(title)}</h2><div class="dots">${'<i></i>'.repeat(4)}</div><p class="pinmsg" aria-live="polite"></p>
      <div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}${cancel?'<button data-k="x" class="kx">پاشگەزبوونەوە</button>':'<span></span>'}<button data-k="0">0</button><button data-k="b" aria-label="سڕینەوە">⌫</button></div></div>`;
    document.body.appendChild(o);document.body.classList.add('lock');
    let v='',busy=false,fails=0,until=0;
    const dots=$$('.dots i',o),msg=$('.pinmsg',o);
    const draw=()=>dots.forEach((d,i)=>d.classList.toggle('on',i<v.length));
    const done=r=>{o.remove();document.removeEventListener('keydown',kd);if(!$('.scrim'))document.body.classList.remove('lock');res(r)};
    async function press(k){
      if(busy)return;
      if(Date.now()<until){msg.textContent='چاوەڕێ بکە '+Math.ceil((until-Date.now())/1000)+' چرکە';return}
      if(k==='x')return done(null);
      if(k==='b'){v=v.slice(0,-1);draw();return}
      if(v.length>=4)return;
      v+=k;draw();
      if(v.length===4){
        if(!validate)return done(v);
        busy=true;const ok=await validate(v);busy=false;
        if(ok)return done(v);
        fails++;o.querySelector('.dots').classList.add('shake');
        setTimeout(()=>{o.querySelector('.dots').classList.remove('shake');v='';draw()},400);
        if(fails>=5){until=Date.now()+30000;fails=0;msg.textContent='٥ جار هەڵە بوو، ٣٠ چرکە چاوەڕێ بکە'.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))}
        else msg.textContent='ژمارەکە هەڵەیە';
      }
    }
    o.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)press(b.dataset.k)});
    const kd=e=>{if(/^[0-9]$/.test(e.key)){e.preventDefault();press(e.key)}else if(e.key==='Backspace')press('b');else if(e.key==='Escape'&&cancel)press('x')};
    document.addEventListener('keydown',kd);
  });
}

function bindSwipeLeft(w,el,onDel){
  let x0=0,y0=0,dx=0,active=false,dir=null,pid=null;
  const TH=()=>Math.min(110,w.offsetWidth*.35||90);
  const set=(x,anim)=>{el.style.transition=anim?'transform .22s ease':'none';el.style.transform=x?`translateX(${x}px)`:'';w.classList.toggle('to-l',x<0);w.classList.toggle('arm',x<=-TH())};
  el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;x0=e.clientX;y0=e.clientY;dx=0;active=true;dir=null;pid=e.pointerId});
  el.addEventListener('pointermove',e=>{if(!active||e.pointerId!==pid)return;const mx=e.clientX-x0,my=e.clientY-y0;
    if(!dir){if(Math.abs(mx)<8&&Math.abs(my)<8)return;dir=Math.abs(mx)>Math.abs(my)?'h':'v';if(dir==='h'){try{el.setPointerCapture(pid)}catch(err){}w.classList.add('dragging')}}
    if(dir!=='h')return;dx=Math.min(0,mx);set(Math.max(dx,-w.offsetWidth*.8),false)});
  const end=async()=>{if(!active)return;active=false;w.classList.remove('dragging');if(dir==='h'&&Math.abs(dx)>6)swipedAt=Date.now();
    if(dir==='h'&&dx<=-TH()){set(-w.offsetWidth,true);const ok=await onDel();if(!ok)set(0,true)}else set(0,true)};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}

/* Backup */
const BCOLS=['products','companies','counts','messages','groups'];
async function exportBackup(){
  const data={app:'sirwan-market',version:1,exportedAt:new Date().toISOString()};
  BCOLS.forEach(c=>data[c]=S[c].map(x=>Object.assign({},x)));
  const json=JSON.stringify(data,null,1);const name='sirwan-backup-'+isoOf(Date.now())+'.json';
  let dl=null;if(S.mode==='cloud'&&window.claude&&window.claude.use){try{dl=await window.claude.use('downloads')}catch(e){}}
  try{
    if(dl)await dl.save({filename:name,data:json});
    else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
    lsSet('sirwan:lastBackup',String(Date.now()));toast('باکئەپەکە پاشەکەوت کرا');if(S.tab==='info')refInfo();
  }catch(e){toast(e&&e.code==='declined'?'پاشەکەوتکردن ڕەت کرایەوە':'نەتوانرا فایلەکە پاشەکەوت بکرێت')}
}
function readText(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result||''));r.onerror=()=>rej(r.error);r.readAsText(file,'utf-8')})}
async function importBackup(file){
  let d;try{const t=(await readText(file)).replace(/^\uFEFF/,'').trim();d=JSON.parse(t)}catch(e){toast('ئەم فایلە ناخوێنرێتەوە، دڵنیابە فایلی باکئەپی بەرنامەکەیە');return}
  return restoreData(d);
}
async function restoreData(d){
  if(!d||typeof d!=='object'||!BCOLS.some(c=>Array.isArray(d[c]))){toast('ئەم باکئەپە دروست نییە');return}
  const rows=[];BCOLS.forEach(c=>(Array.isArray(d[c])?d[c]:[]).forEach(x=>{if(x&&typeof x==='object'&&typeof x.id==='string'&&/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(x.id)&&x.id!=='.'&&x.id!=='..'){const o=Object.assign({},x);delete o.id;rows.push([c,x.id,o])}}));
  if(!rows.length){toast('هیچ داتایەک لەم باکئەپەدا نییە');return}
  const n=c=>rows.filter(r=>r[0]===c).length;
  if(!await confirmBox(`گەڕاندنەوەی ${n('products')} کاڵا، ${n('companies')} کۆمپانیا، ${n('counts')} جەرد و ${n('messages')} پەیام. تۆمارە هاوشێوەکان نوێ دەکرێنەوە و تۆمارەکانی تر دەمێننەوە.`,'گەڕاندنەوە'))return;
  let ok=0;for(let i=0;i<rows.length;i++){const[c,id,o]=rows[i];if(i%20===0)toast('گەڕاندنەوە… '+i+'/'+rows.length);try{await Store.put(c,id,o);ok++}catch(e){if(e&&e.code==='quota_exceeded'){toast('شوێنی داتا پڕ بوو، گەڕاندنەوە ڕاوەستا');return}}}
  toast(ok===rows.length?'باکئەپەکە گەڕێندرایەوە: '+ok+' تۆمار':ok+' لە '+rows.length+' تۆمار گەڕێندرایەوە');refresh();
}
/* In-app snapshots (no files needed) */
const SNAP_KEEP=8,SNAP_CHUNK=80000;
function snapshotData(){const d={app:'sirwan-market',version:1,exportedAt:new Date().toISOString()};BCOLS.forEach(c=>d[c]=S[c].map(x=>Object.assign({},x)));return d}
async function listSnaps(){if(!Store.db)return[];const q=await Store.db.collection('bk').orderBy('at','desc').limit(50).get();return q.docs.map(x=>Object.assign({id:x.id},x.data()))}
async function deleteSnap(sn){for(let i=0;i<(sn.parts||0);i++){try{await Store.db.doc('bkp/'+sn.id+'_'+i).delete()}catch(e){}}await Store.db.doc('bk/'+sn.id).delete()}
async function makeSnapshot(auto){
  const json=JSON.stringify(snapshotData());const id='b'+Date.now();const parts=[];
  for(let i=0;i<json.length;i+=SNAP_CHUNK)parts.push(json.slice(i,i+SNAP_CHUNK));
  for(let i=0;i<parts.length;i++)await Store.db.doc('bkp/'+id+'_'+i).set({data:parts[i]});
  await Store.db.doc('bk/'+id).set({at:Date.now(),auto:!!auto,parts:parts.length,n:{products:S.products.length,companies:S.companies.length,counts:S.counts.length,messages:S.messages.length}});
  lsSet('sirwan:lastBackup',String(Date.now()));
  const all=await listSnaps();for(const old of all.slice(SNAP_KEEP)){try{await deleteSnap(old)}catch(e){}}
}
async function restoreSnap(sn){
  toast('خوێندنەوەی باکئەپ…');let json='';
  try{for(let i=0;i<sn.parts;i++){const d=await Store.db.doc('bkp/'+sn.id+'_'+i).get();if(!d.exists)throw new Error('missing');json+=d.data().data}
    return restoreData(JSON.parse(json))}
  catch(e){toast('ئەم باکئەپە تەواو نییە و ناگەڕێتەوە')}
}
async function autoSnapshot(){
  if(!(S.me.mgr&&Store.db&&S.canWrite))return;if(!S.products.length&&!S.companies.length)return;
  try{const l=await listSnaps();if(!l.length||Date.now()-l[0].at>7*864e5)await makeSnapshot(true)}catch(e){console.warn('auto backup',e)}
}
function pickBackupFile(){
  let inp=document.getElementById('bkfile');if(inp)inp.remove();
  inp=document.createElement('input');inp.type='file';inp.id='bkfile';inp.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';
  inp.addEventListener('change',()=>{const file=inp.files&&inp.files[0];inp.remove();if(file){closeSheet();importBackup(file)}});
  document.body.appendChild(inp);inp.click();
}
function backupSheet(){
  const cloud=!!Store.db;
  const sh=openSheet('باکئەپ',`<p class="muted" style="margin:0 0 10px">${cloud?'باکئەپەکان لە ناو بەرنامەکەدا هەڵدەگیرێن و پێویستیان بە فایل نییە. هەفتانە جارێک خۆکارانە باکئەپ دەکرێت و دوایین ${SNAP_KEEP} باکئەپ دەمێننەوە.':'هەموو داتاکان وەک فایلێک پاشەکەوت بکە.'}</p>
    <div class="fonts">
    ${cloud&&S.canWrite?`<button class="fo th" data-s="snap"><i class="ic-mini">${SI('backup')}</i><span class="st"><b>باکئەپی نوێ ئێستا</b><small>لە ناو بەرنامەکەدا هەڵدەگیرێت</small></span></button>`:''}
    <button class="fo th" data-s="exp"><i class="ic-mini">${SI('backup')}</i><span class="st"><b>داگرتن وەک فایل</b><small>کۆپییەک لەسەر مۆبایلەکەت</small></span></button>
    ${S.canWrite?`<button class="fo th" data-s="imp"><i class="ic-mini" style="transform:rotate(180deg)">${SI('backup')}</i><span class="st"><b>گەڕاندنەوە لە فایل</b><small>لەوانەیە لە ئەپی Claude ی ئەندرۆید نەکرێتەوە</small></span></button>`:''}
    </div>
    ${cloud?`<h3 class="sub">باکئەپە هەڵگیراوەکان</h3><div id="snaps" class="fonts" style="margin-top:10px"><p class="empty">بارکردن…</p></div>`:''}`);
  const drawSnaps=async()=>{const box=$('#snaps',sh);if(!box)return;
    try{const l=(await listSnaps()).slice(0,SNAP_KEEP);
      box.innerHTML=l.length?l.map(x=>{const d=new Date(x.at);const t=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');const n=x.n||{};
        return`<div class="snap"><div class="st"><b>${fmtDate(isoOf(x.at))} ${t}</b><small>${x.auto?'خۆکار':'دەستی'}: ${n.products||0} کاڵا، ${n.companies||0} کۆمپانیا، ${n.messages||0} پەیام</small></div>${S.canWrite?`<button class="btn sm" data-r="${esc(x.id)}">گەڕاندنەوە</button><button class="x" data-d="${esc(x.id)}" aria-label="سڕینەوە">×</button>`:''}</div>`}).join('')
        :'<p class="empty">هێشتا هیچ باکئەپێک نییە.</p>';
      box.onclick=async e=>{const r=e.target.closest('[data-r]'),dl=e.target.closest('[data-d]');
        if(r){const sn=l.find(x=>x.id===r.dataset.r);closeSheet();restoreSnap(sn)}
        else if(dl){const sn=l.find(x=>x.id===dl.dataset.d);if(await confirmBox('ئەم باکئەپە بسڕدرێتەوە؟')){await run(()=>deleteSnap(sn),'سڕایەوە');drawSnaps()}}};
    }catch(e){box.innerHTML='<p class="empty">نەتوانرا لیستەکە بار بکرێت.</p>'}};
  drawSnaps();
  sh.addEventListener('click',async e=>{const b=e.target.closest('[data-s]');if(!b)return;const k=b.dataset.s;
    if(k==='exp'){closeSheet();exportBackup()}
    else if(k==='imp'){pickBackupFile()}
    else if(k==='snap'){b.disabled=true;if(await run(()=>makeSnapshot(false),'باکئەپ هەڵگیرا')){drawSnaps();if(S.tab==='info')refInfo()}b.disabled=false}});
}

/* ---------- Sheets & dialogs ---------- */
function openSheet(title,html){

  s.addEventListener('click',e=>{if(e.target===s||e.target.closest('[data-s="close"]'))closeSheet()});

  return $('.sheet',s);
}
function closeSheet(){$$('.scrim').forEach(x=>x.remove());document.body.classList.remove('lock')}
function confirmBox(msg,ok='سڕینەوە',opt={}){
  return new Promise(res=>{const d=document.createElement('div');d.className='cscrim';
    d.innerHTML=`<div class="cbox" role="alertdialog" aria-modal="true">
      <div class="cwarn" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4.5M12 17.5v.5"/></svg></div>

      ${opt.strong?'<label class="csure"><input type="checkbox"><span>بەڵێ، دڵنیام و دەزانم ئەمە ناگەڕێتەوە</span></label>':''}
      <div class="row"><button class="btn ghost sm" data-c="0">پاشگەزبوونەوە</button><button class="btn danger sm solid" data-c="1" ${opt.strong?'disabled':''}>${esc(ok)}</button></div></div>`;
    const yes=$('[data-c="1"]',d),cb=$('.csure input',d);if(cb)cb.onchange=()=>{yes.disabled=!cb.checked};
    d.addEventListener('click',e=>{const b=e.target.closest('[data-c]');if((b&&!b.disabled)||e.target===d){d.remove();res(!!b&&b.dataset.c==='1')}});
    document.body.appendChild(d);$('[data-c="0"]',d).focus()});
}

    Store.sub('staff',a=>{S.staff=a;S.loadedStaff=true;refresh();authGate()});
    Store.db.doc('settings/pending').onSnapshot(d=>{S.pending=d.exists&&Array.isArray(d.data().list)?d.data().list:[];S.loadedPend=true;refresh();authGate()},()=>{S.loadedPend=true});
    Store.db.doc('settings/auth').onSnapshot(d=>{S.authReq=d.exists?d.data().required!==false:true;S.loadedAuth=true;authGate()},()=>{S.loadedAuth=true});
    if(S.me.mgr&&S.me.id&&S.me.id!=='anon'){const r=Store.db.doc('staff/'+S.me.id);r.get().then(d=>{if(!d.exists||!(d.data()||{}).mgr)r.set(Object.assign({},d.exists?d.data():{},{since:(d.exists&&d.data().since)||Date.now(),seen:Date.now(),mgr:true})).catch(()=>{})}).catch(()=>{})}
    if(!S.me.mgr&&S.me.id&&S.me.id!=='anon'){const r=Store.db.doc('staff/'+S.me.id);r.get().then(d=>{const now=Date.now();if(!d.exists)r.set({since:now,seen:now}).catch(()=>{});else if(now-((d.data()||{}).seen||0)>6*3600e3)r.update({seen:now}).catch(()=>{})}).catch(()=>{})}
    Store.db.doc('settings/contact').onSnapshot(d=>{S.mgrc=d.exists?d.data():{};if(S.ready&&S.tab==='info')refInfo()},()=>{});
    Store.db.doc('settings/staffinfo').onSnapshot(d=>{const prev=JSON.stringify(S.sinfo);S.sinfo=d.exists?d.data():{users:{}};if(prev!==JSON.stringify(S.sinfo)&&S.ready)buildTab()},()=>{});
  }
  Store.sub('companies',a=>{S.companies=a;refresh()});
  Store.sub('products',a=>{S.products=a;refresh()});
  Store.sub('groups',a=>{S.groups=a;if(S.grp&&!S.grp.startsWith('dm:')&&!visibleGroups().some(g=>g.id===S.grp)){S.grp=null;if(S.tab==='messages'){buildTab();return}}refresh()});
  Store.sub('counts',a=>{S.counts=a;refresh()},{order:'at',limit:200});

  S.ready=true;buildTab();
